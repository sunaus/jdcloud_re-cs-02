name: Build

# Builds the edma-nss image for the JDCloud RE-CS-02 only, default flavour
# (no mesh), on manual dispatch only:
#   check -> draft release -> build -> publish -> prune
# All build parameters live in the `env:` block below and in devices/jdcloud_re-cs-02/config.
on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: JuliusBairaktaris/openwrt-nss-edma
  UPSTREAM_REF: nss-edma-rework
  NSS_REPO: JuliusBairaktaris/nss-packages
  NSS_REF: edma-nss
  VARIANT: edma-nss
  RELEASE_PREFIX: edma-nss
  KEEP: "2"                     # newest releases to retain, per prefix
  FEEDS: "src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;edma-nss"
  # luci-app-athena-led is not in any OpenWrt feed; taken from here instead.
  ATHENA_REPO: VIKINGYFY/immortalwrt
  ATHENA_REF: main

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
    outputs:
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      nss_sha: ${{ steps.check.outputs.nss_sha }}
      need: ${{ steps.check.outputs.need }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: bash scripts/check-updates.sh

  release:
    name: Create draft release
    needs: check
    if: needs.check.outputs.need == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_SHA: ${{ needs.check.outputs.upstream_sha }}
      NSS_SHA: ${{ needs.check.outputs.nss_sha }}
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - id: draft
        run: |
          set -euo pipefail
          date=$(date -u +%F)
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          tag="${RELEASE_PREFIX}-${stamp}-${GITHUB_RUN_ID}"

          # The build job uploads into the draft; it is published only once
          # the build has succeeded, so a partial image set never goes out.
          {
            echo "## OpenWrt Build — ${VARIANT}, JDCloud RE-CS-02 (AX6600)"
            echo "- **Date**: $date"
            echo "- **Variant**: \`${VARIANT}\`"
            echo "- **Target**: \`qualcommax/ipq60xx\`, \`jdcloud_re-cs-02\`"
            echo "- **Upstream**: \`${UPSTREAM_REPO}@${UPSTREAM_SHA}\`"
            if [[ -n "${NSS_SHA}" ]]; then
              echo "- **NSS**: \`${NSS_SHA}\`"
            fi
            echo "- **Trigger**: \`${GITHUB_EVENT_NAME}\`"
            echo
            echo "Flash the \`...-jdcloud_re-cs-02-squashfs-sysupgrade.bin\` asset over an"
            echo "existing OpenWrt/ImmortalWrt install, without keeping settings when coming"
            echo "from ImmortalWrt. This is a sysupgrade image only - there is no factory image."
            echo
            echo "The offload comes up at boot; \`nss-status\` reports its health."
            echo "To stay on the plain host stack instead:"
            echo "\`uci set nss.general.enabled='0'; uci commit nss; reboot\`."
          } >release_notes.md

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "OpenWrt ${VARIANT} RE-CS-02 $date" \
            --notes-file release_notes.md

          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.device }}
    needs: [check, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # One entry per devices/<name>/ directory.
        device: [jdcloud_re-cs-02]
    env:
      GH_TOKEN: ${{ github.token }}
      DEVICE: ${{ matrix.device }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          # Pinned to the ubuntu-26.04 runner. OpenWrt main builds its own
          # flex/bison/etc. host tools, so the host set is the minimal OpenWrt prerequisite list
          # for Ubuntu 26.04. rsync is for prepare-build.sh's overlay step. Everything else
          # (file, wget, unzip, gh) is preinstalled on the GitHub runner image.
          # The runner image carries third-party apt repos the build has no use for,
          # and their indexes intermittently fail to verify; the install below is the
          # step that has to succeed.
          sudo apt-get update || true
          sudo apt-get install -y \
            bzip2 g++ gawk gcc git glibc-source libncurses-dev make rsync

      - name: Checkout OpenWrt source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.upstream_sha }}
          fetch-depth: 0
          path: openwrt

      # Into package/ before prepare-build.sh, so the feeds install sees it.
      # Its Makefile includes feeds/luci/luci.mk: the luci feed has to be
      # there first, or the first package scan caches it as an empty package
      # and defconfig drops it.
      - name: Add luci-app-athena-led
        working-directory: openwrt
        run: |
          set -euo pipefail
          ./scripts/feeds update luci
          cd ..
          git clone --depth=1 --filter=blob:none --sparse --branch "$ATHENA_REF" \
            "https://github.com/${ATHENA_REPO}.git" athena_src
          git -C athena_src sparse-checkout set package/emortal/luci-app-athena-led
          cp -a athena_src/package/emortal/luci-app-athena-led openwrt/package/
          rm -rf athena_src

      - name: Checkout builder repo
        uses: actions/checkout@v7
        with:
          path: builder

      - name: Prepare build environment
        env:
          OPENWRT_DIR: ${{ github.workspace }}/openwrt
          BUILDER_REPO: ${{ github.workspace }}/builder
        run: bash builder/scripts/prepare-build.sh

      - name: Set reproducible-build env
        working-directory: openwrt
        run: |
          set -euo pipefail
          {
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
            echo "TZ=UTC"
            echo "LC_ALL=C"
            echo "KBUILD_BUILD_USER=builder"
            echo "KBUILD_BUILD_HOST=github"
          } >>"$GITHUB_ENV"

      - name: Download sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            make download -j"$(nproc)" V=s && break
            echo "Download attempt $attempt failed; retrying..."
            sleep 5
          done

      # ccache hashes neither the assembler nor cc1, so the key covers every
      # toolchain input and a change there starts from an empty cache. GitHub
      # drops entries unused for 7 days and evicts the oldest over the quota.
      # The GCC version string carries the OpenWrt revision, which lands in
      # the compiler binary and the kernel's autoconf.h and so misses every
      # target object on each new commit; the toolchain tree hash replaces it.
      - name: Compute ccache key
        id: ccache
        run: |
          set -euo pipefail
          tree=$(git -C openwrt rev-parse HEAD:toolchain)
          mk=openwrt/toolchain/gcc/common.mk
          # shellcheck disable=SC2016 # make variables, not shell
          grep -qx 'PKGVERSION=OpenWrt GCC $(PKG_VERSION) $(REVISION)' "$mk"
          sed -i "s/^PKGVERSION=.*/PKGVERSION=OpenWrt GCC \$(PKG_VERSION) ${tree:0:12}/" "$mk"
          sum=$({
            echo "$tree"
            grep -E '^CONFIG_(BINUTILS|GCC|LIBC|MUSL|GLIBC)_' openwrt/.config
            gcc --version; as --version
          } | sha256sum | cut -c1-16)
          echo "prefix=ccache-${{ env.VARIANT }}-$sum-" >>"$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: openwrt/.ccache
          key: ${{ steps.ccache.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.ccache.outputs.prefix }}

      - name: Build
        working-directory: openwrt
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 4G
        run: |
          set -euo pipefail
          make -j"$(nproc)" || make -j1 V=s
          staging_dir/host/bin/ccache -s

      - name: Upload images
        run: |
          set -euo pipefail
          out=$(dirname "$(find openwrt/bin/targets -name sha256sums)")

          # Sysupgrade images only - no factory/initramfs, per the project's
          # sysupgrade-from-existing-OpenWrt model. Image names carry the
          # device, so the groups never collide in the release. The build
          # metadata does, so it is uploaded under the group name instead of
          # dropped - it is the answer to "what exactly was in this image".
          mapfile -t assets < <(find "$out" -maxdepth 1 -type f -name 'openwrt-*-squashfs-sysupgrade.bin')
          [[ ${#assets[@]} -gt 0 ]] || { echo "::error::no sysupgrade images in $out"; exit 1; }
          grep 'sysupgrade.bin' "$out/sha256sums" >"sha256sums-${DEVICE}.txt"
          cp "$out/config.buildinfo" "config-${DEVICE}.buildinfo"

          # --clobber, so re-running a job that died mid-upload is a recovery
          # and not a permanent "asset already exists".
          for attempt in 1 2 3; do
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" --clobber \
              "${assets[@]}" "sha256sums-${DEVICE}.txt" "config-${DEVICE}.buildinfo" && break
            [[ $attempt -lt 3 ]] || { echo "::error::upload failed after $attempt attempts"; exit 1; }
            echo "::warning::upload attempt $attempt failed; retrying"
            sleep 15
          done

          {
            echo "## ${DEVICE}"
            echo "- assets: ${#assets[@]}"
          } >>"$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release
    needs: [release, build]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Publish or discard
        run: |
          set -euo pipefail
          if [[ "$BUILD_RESULT" != "success" ]]; then
            # A draft left behind is never pruned. Drop it and fail. No
            # --cleanup-tag: a draft's tag exists only inside the release.
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            echo "::error::the build failed ($BUILD_RESULT); draft release discarded"
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  prune:
    name: Prune old releases
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Prune
        run: |
          set -euo pipefail
          # No `stats` branch here, so no download count to fold into.
          PREFIX="$RELEASE_PREFIX" STATS=0 bash scripts/prune-releases.sh

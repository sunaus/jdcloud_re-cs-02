# Dispatch stub. GitHub only offers "Run workflow" for a workflow file that
# also exists on the default branch; the real one lives on the VIKINGYFY branch.
# Pick "Use workflow from: VIKINGYFY" - running it on main only fails.
name: QCA-ALL

on:
  workflow_dispatch:

jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - name: Wrong branch
        run: |
          echo "::error::QCA-ALL runs from the VIKINGYFY branch. Re-run with 'Use workflow from: VIKINGYFY'."
          exit 1
